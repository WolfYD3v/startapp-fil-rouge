<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StartApp</title>
        <link rel="stylesheet" href="css/main.css" class="css" />
    </head>
    <body>
        <main class="d-flex flex-column w-100 h-100 p-sm-5 justify-content-center align-items-center">
            <div class="d-flex flex-column w-100 h-auto p-sm-5 gap-4 justify-content-center">
                <div class="d-flex flex-column w-100 h-auto p-3 p-sm-5 gap-4 justify-content-center align-items-center">
                    <h2 class="text-center fw-bold w-100">Welcome back !</h2>
                    <form id="login-form" class="d-flex flex-column w-100 gap-3" novalidate>
                        <fieldset class="d-flex flex-column w-100 gap-2">
                            <label for="username-text"></label>
                            <input id="username-text" name="username-text" type="text" placeholder="Username" required >
                            <label for="password-text"></label>
                            <input id="password-text" name="password-text" type="text" placeholder="Password" required >
                            <div class="d-flex flex-row gap-2 justify-content-around">
                                <a class="link" href="#" title="Get help with your username issue">username forgot</a>
                                <a class="link" href="#" title="Get help with your password issue">password forgot</a>
                            </div>
                        </fieldset>
                        <div class="w-100" style="height: 25px;"></div>
                        <fieldset class="d-flex flex-column w-100 gap-1 align-items-center">
                            <a class="link" href="sign_in_page.html" title="Create your StartAPP Account">I don't have an account yet</a>
                            <button id="login-button" type="submit" class="button" title="Login with your account">login</button>
                        </fieldset>
                    </form>
                </div>
            </div>
        </main>
        
        <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
        <script type="module">
            import { initForm } from "./js/pages/form_script.js";
            initForm("login-form", "profile_page.html");
        </script>
    </body>
</html>
