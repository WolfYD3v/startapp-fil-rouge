<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StartApp</title>
        <link rel="stylesheet" href="css/main.css" class="css" />
        <link rel="stylesheet" href="css/pages/_listing_page.css" class="css" />
	<link rel="icon" type="image/x-icon" href="icon.ico">
    </head>
    <body>
        <main>
            <div id="navbar-container"></div>
            <div class="container">
                <div class="page-listing-searching-container w-100 d-flex flex-column flex-md-row gap-2">
                    <input type="search" name="search-bar" placeholder="search..." id="search-bar" class="w-100 page-listing-search-bar" title="The serachbar, to search for precise prestations">
                    <a class="button page-listing-filters-button" title="Show/Hide the filters menu, to find the prestation you want with more ease">filters</a>
                </div>
                <div id="prestations-container" class="d-flex flex-column gap-1 gap-sm-2"></div>
                <div class="page-listing-selection-container w-100 h-auto d-flex flex-row justify-content-center align-items-center gap-2 p-2">
                    <button id="previous-page-btn" class="button" title="Go to the previous listing"><</button>
                    <h2 id="page-counter" class="d-flex justify-content-center align-items-center m-0 page-listing-counter" title="The listing page count">1</h2>
                    <button id="next-page-btn" class="button" title="Go to the next listing">></button>
                </div>
            </div>
            <div id="footer-container"></div>
        </main>
        
        <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="js/pages/setup_page.js" type="module"></script>
        <script src="js/pages/listing_page.js" type="module"></script>
    </body>
</html>
