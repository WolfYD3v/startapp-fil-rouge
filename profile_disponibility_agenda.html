<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StartApp</title>
        <link rel="stylesheet" href="css/main.css" class="css" />
        <link rel="stylesheet" href="css/pages/_profile_disponibility_agenda.css" class="css" />
	<link rel="icon" type="image/x-icon" href="icon.ico">
    </head>
    <body>
        <main>
            <div id="navbar-container"></div>
            <div id="container" class="container">
                <div class="d-flex flex-column flex-md-row gap-2 gap-sm-3">
                    <img class="profile-user-image" src="assets/images/user_image.jpg" alt="Your user profile picture">
                    <h2 class="w-100 fw-bold">Profile Name</h2>
                </div>
                <div class="all-montly-prestations-container d-flex flex-column gap-3 p-2">
                    <div class="montly-prestations-container d-flex flex-column gap-1">
                        <h2 class="w-100">Month, Year</h2>
                        <div id="montly-prestations-list-container" class="montly-prestations-list-container d-flex flex-column gap-1"></div>
                    </div>
                </div>
                <button id="see-more-prestations-btn" class="button" title="Load more prestation hosted from {Profile Name}">see more prestations</button>
            </div>
            <div id="footer-container"></div>
        </main>

        <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="js/pages/profile_disponibility_agenda.js" type="module"></script>
    </body>
</html>
