<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StartApp</title>
        <link rel="stylesheet" href="css/main.css" class="css" />
        <link rel="stylesheet" href="css/pages/_rate_prestation_page.css" class="css" />
    </head>
    <body>
        <main>
            <div id="navbar-container"></div>
            <div class="container">
                <h2 class="text-center fw-bold w-100">Did the prestation take place as planned?</h2>
                <div class="d-flex flex-row gap-2 justify-content-center">
                    <a id="prestation-took-place-btn" href="#" class="button" title="Says you did the prestation">yes</a>
                    <a id="prestation-not-took-place-btn" href="#" class="button" title="Says you haven't did the prestation">no</a>
                </div>
                <div class="w-100 separation-area"></div>
                <div class="d-flex flex-column gap-2">
                    <div id="stars-container" class="d-flex flex-row gap-2" title="Rate the prestation on a rate from 0 to 5 stars">
                        <h2 class='as rating-star rating-star-not-activated'>☆</h2>
                        <h2 class='as rating-star rating-star-not-activated'>☆</h2>
                        <h2 class='as rating-star rating-star-not-activated'>☆</h2>
                        <h2 class='as rating-star rating-star-not-activated'>☆</h2>
                        <h2 class='as rating-star rating-star-not-activated'>☆</h2>
                    </div>
                    <form id="rating-form" class="d-flex flex-column w-100 h-auto gap-2 align-items-center">
                        <fieldset class="d-flex flex-column w-100 h-auto gap-2 align-items-center">
                            <label for="user-review-text" class="w-100">Review your experience with {username} (1500 characters max.)</label>
                            <textarea id="user-review-text" class="w-100" name="user-review-text" maxlength="1500" minlength="15" required></textarea>
                        </fieldset>
                        <button id="submit-button" type="submit" class="button">post review</button>
                    </form>
                </div>
            </div>
            <div id="footer-container"></div>
        </main>
        
        <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="js/pages/setup_page.js" type="module"></script>
        <script src="js/pages/rate_prestation_page.js"></script>
    </body>
</html>
