<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StartApp</title>
        <link rel="stylesheet" href="css/main.css" class="css" />
        <link rel="stylesheet" href="css/pages/_edit_profile_page.css" class="css" />
    </head>
    <body>
        <main>
            <div id="navbar-container"></div>
            <div class="container">
                <form id="edit-profile-form" class="d-flex flex-column gap-3" action="profile_page.html" method="get" novalidate>
                    <div class="d-flex flex-column flex-md-row gap-2 gap-sm-3 w-100">
                        <div id="user-image-img" class="file-upload-zone d-flex flex-column gap-3">
                            <div class="d-flex flex-column gap-1 gap-sm-2 w-100">
                                <img src="assets/images/user_image.jpg" alt="Your user profile picture" width="150" height="150">
                                <input type="file" id="image-upload-zone" name="image-upload-zone" accept=".jpg, .jpeg, .png, .webp">
                            </div>
                        </div>
                        <fieldset class="w-100 d-flex flex-column gap-2">
                            <label for="profile-name">Change your username (50 characters max.)</label>
                            <input type="text" maxlength="50" id="profile-name" name="profile-name" />
                            <div class="w-100 form-separation-area"></div>
                            <label for="information">Change your displayed information (75 characters max.)</label>
                            <input type="text" maxlength="75" id="information" name="information" />
                        </fieldset>
                    </div>
                    <div class="w-100 edit-links-container p-2 d-flex flex-column gap-2">
                        <div id="links-container" class="w-100 flex-row gap-2 links-container scroll-section-no-scrollbar"></div>
                        
                        <div id="edit-profile-link-widget-popup" class="h-100 flex-column justify-content-center align-items-center gap-2 p-4">
                            <div class="d-flex flex-column flex-sm-row gap-3 w-100">
                                <div id="edit-profile-link-widget-img" class="file-upload-zone d-flex flex-column gap-3">
                                    <label for="image-upload-zone">Link custom image</label>
                                    <div class="d-flex flex-column gap-1 gap-sm-2 w-100">
                                        <img src="assets/images/social_networks_image.png" alt="A social networks image" width="150" height="150">
                                        <input type="file" id="image-upload-zone" name="image-upload-zone" accept=".jpg, .jpeg, .png, .webp">
                                    </div>
                                </div>
                                <div class="d-flex flex-column gap-2 w-100">
                                    <label for="profile-link-widget-name">Name of the link</label>
                                    <input type="text" id="profile-link-widget-name" name="profile-link-widget-name">
                                    <div class="w-100 form-separation-area"></div>
                                    <label for="profile-link-widget-username">Username of the link</label>
                                    <input type="text" id="profile-link-widget-username" name="profile-link-widget-username">
                                    <div class="w-100 form-separation-area"></div>
                                    <label for="profile-link-widget-link">URL of the link</label>
                                    <input type="text" id="profile-link-widget-link" name="profile-link-widget-link">
                                </div>
                            </div>
                            <div class="w-100 form-separation-area"></div>
                            <div class="w-100 form-separation-area"></div>
                            <div id="edit-profile-link-widget-popup-buttons-container" class="d-flex flex-column flex-sm-row gap-2 w-100">
                                <button id="update-profile-link-widget-btn" type="button" class="button" title="Update the informations of the profile link widget">update</button>
                                <button id="cancel-profile-link-widget-btn" type="button" class="button" title="Cancel the modifications of the informations of the profile link widget">cancel</button>
                                <button id="delete-profile-link-widget-btn" type="button" class="button" title="Delete the profile link widget">delete</button>
                            </div>
                        </div>

                        <a id="create-profile-link-widget-button" class="button fw-bold" title="Add a new profile link widget to your profile, click on it to edit it">+</a>
                    </div>
                    <label class="w-100" for="description">Tell about yourself (1500 characters max.)</label>
                    <textarea class="w-100" name="description" id="description" maxlength="1500"></textarea>
                    <fieldset class="d-flex flex-row gap-2 w-100">
                        <button class="button" type="submit" title="Validates the modifications made on your profile, and update the informations">validate changes</button>
                        <button class="button" type="button" title="Cancel the modifications made on your profile, updating nothing">cancel</button>
                    </fieldset>
                </form>
            </div>
            <div id="footer-container"></div>
        </main>

        <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="js/pages/file_upload_zones.js"></script>
        <script src="js/pages/edit_profile_page.js" type="module"></script>
    </body>
</html>
