<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StartApp</title>
        <link rel="stylesheet" href="css/main.css" class="css" />
        <link rel="stylesheet" href="css/pages/_create_edit_prestation_page.css" class="css" />
    </head>
    <body>
        <main>
            <div id="navbar-container"></div>
            <div class="container">
                <p>All fields marked with * are required</p>
                <form id="form" class="d-flex flex-column w-100 h-auto gap-1 gap-sm-2" novalidate>
                    
                    <!-- FORM SECTION 1 : General Informations -->
                    <fieldset class="form-section-container d-flex flex-column h-auto w-100 gap-2 p-1">
                        <div class="form-section-top d-flex flex-row h-auto p-2 gap-3">
                            <button id="form-section-1-toggle-button" type="button" class="button" title="Develop this form section">v</button>
                            <h3 class="d-flex align-items-center h-100 text-decoration-underline">I - General Informations</h3>
                        </div>
                        <div id="form-section-1" class="d-flex flex-column h-auto w-100 gap-2 p-1">
                            <label for="prestation-name">Name your prestation (75 characters max.) *</label>
                            <input type="text" maxlength="75" id="prestation-name" name="prestation-name" required />
                            <div class="w-100 form-seperation-area"></div>
                            <label for="category-select">What type of prestation do you offer *</label>
                            <select id="category-select" name="category-select" required>
                                <option value="Undefined">Undefined</option>
                                <option value="Digital Support">Digital Support</option>
                                <option value="In-Home Service/Housekepping">In-Home Service/Housekepping</option>
                                <option value="Financial Support">Financial Support</option>
                                <option value="Legal Aid">Legal Aid</option>
                                <option value="Sports Support">Sports Support</option>
                            </select>
                            <div class="w-100 form-seperation-area"></div>
                            <label for="file-upload-zone">Upload an illustration image for your prestation (optionnal)</label>
                            <div id="temp-prestation-img" class="file-upload-zone d-flex flex-column gap-3">
                                <div class="d-flex flex-column gap-1 gap-sm-2 w-100">
                                    <img src="assets/images/prestation_image.jpg" alt="Your user profile picture" width="150" height="150">
                                    <input type="file" id="image-upload-zone" name="image-upload-zone" accept=".jpg, .jpeg, .png, .webp">
                                </div>
                            </div>
                            <div class="w-100 form-seperation-area"></div>
                            <label for="location">Where does the presentation take place (in person/online)? *</label>
                            <input type="text" id="location" name="location" required />
                        </div>
                    </fieldset>

                    <!-- FORM SECTION 2 : Desciption -->
                    <fieldset class="form-section-container d-flex flex-column h-auto w-100 gap-2 p-1">
                        <div class="form-section-top d-flex flex-row h-auto p-2 gap-3">
                            <button id="form-section-2-toggle-button" type="button" class="button" title="Develop this form section">v</button>
                            <h3 class="d-flex align-items-center h-100 text-decoration-underline">II - Desciption</h3>
                        </div>
                        <div id="form-section-2" class="d-flex flex-column h-auto w-100 gap-2 p-1">
                            <label for="desciption-text">Describe your prestation to show the objectives of what you sell (1500 characters max.) *</label>
                            <textarea id="desciption-text" name="desciption-text" maxlength="1500" required></textarea>
                        </div>
                    </fieldset>

                    <!-- FORM SECTION 3 : Date and Pricing -->
                    <fieldset class="form-section-container d-flex flex-column h-auto w-100 gap-2 p-1">
                        <div class="form-section-top d-flex flex-row h-auto p-2 gap-3">
                            <button id="form-section-3-toggle-button" type="button" class="button" title="Develop this form section">v</button>
                            <h3 class="d-flex align-items-center h-100 text-decoration-underline">III - Date and Pricing</h3>
                        </div>
                        <div id="form-section-3" class="d-flex flex-column h-auto w-100 gap-2 p-1">
                            <label for="date">When your prestation will occur? *</label>
                            <input type="date" id="date" name="date" required>
                            <div class="w-100 form-seperation-area"></div>
                            <label for="price">What is the price of your prestation? (1.00$ or above) *</label>
                            <input type="number" id="price" name="price" min="1.00" step="0.01" value="1" required>
                    </fieldset>

                    <!-- FORM SECTION 4 : Buttons -->
                    <div class="form-section-container d-flex flex-column flex-sm-row w-100 p-2 gap-2">
                        <button type="button" class="button" title="Cancel the modifications/creation of the prestation">Cancel</button>
                        <button type="reset" class="button" title="Reset the form, to start modify/create a prestation of a fresh and clean form">Clear</button>
                        <button id="submit-button" type="submit" class="button" title="Publish the created prestation, ready to be seen and booked">Publish</button>
                    </div>
                    
                </form>

            </div>
            <div id="footer-container"></div>
        </main>
        
        <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="js/pages/setup_page.js" type="module"></script>
        <script src="js/pages/file_upload_zones.js"></script>
        <script src="js/pages/create_edit_prestation_page.js" type="module"></script>
    </body>
</html>
