<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StartApp</title>
        <link rel="stylesheet" href="css/main.css" class="css" />
        <link rel="stylesheet" href="css/pages/_profile_page.css" class="css" />
	<link rel="icon" type="image/x-icon" href="icon.ico">
    </head>
    <body>
        <main>
            <div id="navbar-container"></div>
            <div class="container">
                <div class="d-flex flex-column flex-md-row gap-2 gap-sm-3">
                    <img class="profile-user-image" src="assets/images/user_image.jpg" alt="Your user profile picture">
                    <div class="w-100 d-flex flex-column">
                        <h2 id="profile-name" class="fw-bold" title="The profile name of a user">Profile Name</h2>
                        <h4 id="information" title="The information if a user">Information</h4>
                        <h4 id="joining-date" title="When the user joined StartApp">Joined at {joining date}</h4>
                    </div>
                </div>
                <div class="d-flex flex-column flex-md-row gap-2">
                    <a href="chat_page.html" class="button" title="Enter in contact by messaing the user">message</a>
                    <a href="profile_disponibility_agenda.html" class="button" title="Show the user's disponibility agenda">agenda</a>
                    <!-- Button to remove if the user is not related to the visited profile, something like that. I think you get what your past you wants you to do future me -->
                    <a href="edit_profile_page.html" class="button" title="Edit the profile">edit</a>
                </div>
                <div id="links-container" class="w-100 d-flex flex-row gap-3 p-2 links-container scroll-section-no-scrollbar"></div>
                <p id="description" title="The description of the user profile"></p>
            </div>
            <div id="footer-container"></div>
        </main>

        <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="js/pages/profile_page.js" type="module"></script>
    </body>
</html>
