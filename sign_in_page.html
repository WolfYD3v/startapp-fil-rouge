<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StartApp</title>
        <link rel="stylesheet" href="css/main.css" class="css" />
    </head>
    <body>
        <main class="d-flex flex-column w-100 h-100 p-sm-5 justify-content-center align-items-center">
            <div class="d-flex flex-column w-100 h-auto p-sm-4 gap-3 gap-sm-1 justify-content-center">
                <div class="d-flex flex-column w-100 h-auto p-3 p-sm-5 gap-4 justify-content-center align-items-center">
                    <h2 class="text-center fw-bold w-100">Join the StartApp adventure by creating your account</h2>
                    <form id="sign-in-form" class="d-flex flex-column w-100 gap-3" action="verify_account_page.html" method="get" novalidate>
                        <fieldset class="d-flex flex-column w-100 gap-2">
                            <label for="username-text"></label>
                            <input id="username-text" name="username-text" type="text" placeholder="Username" required >
                            <label for="phone-number-text"></label>
                            <input id="phone-number-text" name="phone-number-text" type="tel" placeholder="Phone Number" pattern="[0-9]{10}" inputmode="numeric" autocomplete="tel" required >
                            <small>Format expected: 0123456789</small>
                            <label for="e-mail-text"></label>
                            <input id="e-mail-text" name="e-mail-text" type="email" placeholder="E-Mail" required >
                            <label for="password-text"></label>
                            <input id="password-text" name="password-text" type="text" placeholder="Password" required >
                            <label for="confirm-password-text"></label>
                            <input id="confirm-password-text" name="confirm-password-text" type="text" placeholder="Confirm Password" required >
                        </fieldset>
                        <div class="w-100" style="height: 25px;"></div>
                        <fieldset class="d-flex flex-column w-100 gap-1 align-items-center">
                            <a class="link" href="login_page.html" title="Login to your already existing account">I already have an account</a>
                            <button id="create-account-button" type="submit" class="button" title="Create your account, and start verify your identity">create your account</button>
                        </fieldset>
                    </form>
                </div>
                <p class="px-3 px-sm-5 w-100">
                    By signing up, you agree to our <a href="#">Terms of Service</a> and to occasionally receive emails from us.<br />
                    Please read our <a href="#">Privacy Policy</a> to learn how we use your personal data.
                </p>
            </div>
        </main>
        
        <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="js/pages/sign_in_page.js" type="module"></script>
    </body>
</html>
